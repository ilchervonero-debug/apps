const L={};Object.entries(lessons).forEach(([k,v])=>L[k]={title:v[0],sub:v[1],objective:v[2],blocks:v[3],book:v[4],checks:[v[5]]});
const done=id=>localStorage.getItem('dtp-done-'+id)==='1';function render(){calendar.innerHTML='';for(let w=1;w<=12;w++){let row=document.createElement('div');row.className='week';row.innerHTML=`<div class="weeklabel"><b>${String(w).padStart(2,'0')}</b><span>SEMANA ${w}</span></div>`;for(let c=1;c<=3;c++){let id=`${w}-${c}`,d=L[id],s=document.createElement('div');s.className='slot';s.innerHTML=`<button class="card ${done(id)?'done':''}"><span class="mark"></span><span class="kicker">CLASE ${String(c).padStart(2,'0')}</span><span class="title">${d.title}</span><span class="sub">${d.sub}</span><span class="date">Fecha: <input type="date" value="${localStorage.getItem('dtp-date-'+id)||''}"></span></button>`;let b=s.querySelector('button'),i=s.querySelector('input');b.onclick=e=>{if(e.target!==i)openLesson(id)};i.onclick=e=>e.stopPropagation();i.onchange=e=>localStorage.setItem('dtp-date-'+id,e.target.value);row.appendChild(s)}calendar.appendChild(row)}progress()}
function openLesson(id){let d=L[id];modalKicker.textContent=`SEMANA ${id.split('-')[0]} · CLASE ${id.split('-')[1]}`;modalTitle.textContent=d.title;let blocks=d.blocks.map(b=>`<div class="row"><div class="time">${b[0]}</div><div><b>${b[1]}</b><div>${b[2]}</div>${b[3]?`<div class="commands">${b[3].split(',').map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div></div>`).join('');modalBody.innerHTML=`<div class="complete"><b>Clase realizada</b><input id="complete" type="checkbox" ${done(id)?'checked':''}></div><div class="callout"><b>Objetivo</b><div>${d.objective}</div></div>${blocks}<div class="book"><b>Bibliografía</b><div>${d.book}</div></div><div class="checks"><label><input type="checkbox"> ${d.checks[0]}</label></div>`;complete.onchange=e=>{localStorage.setItem('dtp-done-'+id,e.target.checked?'1':'0');render()};backdrop.classList.add('open')}
function progress(){let n=0;for(let w=1;w<=12;w++)for(let c=1;c<=3;c++)if(done(`${w}-${c}`))n++;progressText.textContent=`${n} / 36`;progressFill.style.width=`${n/36*100}%`}close.onclick=()=>backdrop.classList.remove('open');backdrop.onclick=e=>{if(e.target===backdrop)backdrop.classList.remove('open')};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
