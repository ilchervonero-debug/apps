<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c83a2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trazo al Píxel">
<title>Del Trazo al Píxel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.svg">
<style>
:root{--red:#c83a2d;--red2:#9f2e27;--ink:#202124;--muted:#6d7378;--line:#d9dddf;--warm:#f8eeeb;--done:#9aa0a4}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f4;color:var(--ink)}button,input{font:inherit}.top{background:linear-gradient(105deg,var(--red),var(--red2));color:white;padding:18px 22px}.brand{font-size:28px;font-weight:900;line-height:.92}.brand small{display:block;font-size:11px;letter-spacing:.08em;margin-top:8px}.top p{margin:10px 0 0;font-size:13px;opacity:.9}.main{max-width:1280px;margin:auto;padding:16px}.progressbox{background:white;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:14px}.progresshead{display:flex;justify-content:space-between;gap:10px}.bar{height:9px;background:#e6e9ea;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--red);width:0;transition:.2s}.calendar{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.head,.week{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr))}.head{background:#eceff0;font-size:12px;font-weight:800}.head div{padding:10px;border-right:1px solid var(--line)}.week{border-top:1px solid var(--line);min-height:122px}.weeklabel{padding:12px;background:#f7f8f8;border-right:1px solid var(--line)}.weeklabel b{display:block;color:var(--red);font-size:18px}.weeklabel span{font-size:10px;color:var(--muted)}.slot{padding:9px;border-right:1px solid var(--line)}.slot:last-child{border-right:0}.card{width:100%;height:100%;min-height:102px;text-align:left;border:1px solid #e2c5bf;background:var(--warm);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative}.card.done{background:#eceeef;border-color:#d3d7d9;color:#73777a}.kicker{font-size:10px;font-weight:800;color:var(--red)}.title{font-size:14px;font-weight:800;line-height:1.15;padding-right:24px}.sub{font-size:11px;color:var(--muted);margin-top:auto}.date{font-size:11px;color:var(--red2)}.date input{border:0;border-bottom:1px dashed #c8a39d;background:transparent;width:118px;color:inherit}.mark{position:absolute;right:8px;top:8px;width:20px;height:20px;border:2px solid var(--red);border-radius:50%}.done .mark{background:var(--done);border-color:var(--done)}.done .mark:after{content:'✓';color:white;display:grid;place-items:center;font-size:12px;font-weight:900}.backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.backdrop.open{display:flex}.modal{width:min(850px,100%);max-height:90vh;overflow:auto;background:white;border-radius:14px}.mhead{position:sticky;top:0;background:linear-gradient(105deg,var(--red),var(--red2));color:white;padding:15px 17px;display:flex;justify-content:space-between;gap:12px}.mhead h2{margin:3px 0 0;font-size:20px}.close{border:0;background:#ffffff22;color:white;border-radius:50%;width:34px;height:34px;font-size:20px}.body{padding:17px}.complete{display:flex;justify-content:space-between;align-items:center;background:#f6f7f7;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:13px}.callout{background:var(--warm);border-left:4px solid var(--red);padding:12px;border-radius:8px}.row{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.time{font-weight:800;color:var(--red)}.commands span{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 6px;margin:4px 4px 0 0;font-family:monospace}.book{margin-top:13px;background:#f6f8f8;border:1px solid var(--line);padding:12px;border-radius:9px}.checks{display:grid;gap:7px;margin-top:13px}.empty{color:var(--muted)}@media(max-width:820px){.calendar{overflow:auto}.head,.week{grid-template-columns:78px repeat(3,230px);min-width:768px}.main{padding:10px}}
</style>
</head>
<body>
<header class="top"><div class="brand">DEL TRAZO<br>AL PÍXEL<small>GUÍA DOCENTE · 12 SEMANAS</small></div><p>Calendario interactivo · 36 clases · avance guardado en el dispositivo</p></header>
<main class="main"><section class="progressbox"><div class="progresshead"><b>AVANCE DEL CURSO</b><span id="progressText">0 / 36</span></div><div class="bar"><div class="fill" id="progressFill"></div></div></section><section class="calendar"><div class="head"><div>SEMANA</div><div>CLASE 1</div><div>CLASE 2</div><div>CLASE 3</div></div><div id="calendar"></div></section></main>
<div class="backdrop" id="backdrop"><article class="modal"><header class="mhead"><div><small id="modalKicker"></small><h2 id="modalTitle"></h2></div><button class="close" id="close">×</button></header><div class="body" id="modalBody"></div></article></div>
<script>
const lessons={"1-1":{"title":"Diseñar antes de dibujar","sub":"Wong + AutoCAD","objective":"Romper la asociación “dibujar = copiar”. AutoCAD se presenta como herramienta de exploración gráfica antes que como herramienta de documentación.","blocks":[["0–15","Apertura.","Presentar el proyecto transversal de las 12 semanas. Diferenciar representar algo existente de diseñar algo que todavía no existe."],["15–35","Wucius Wong.","Punto → línea → plano → forma. Introducir módulo, repetición, proximidad, separación, contacto, superposición, escala, contraste y ritmo. Pregunta guía: ¿qué regla estás utilizando?"],["35–70","AutoCAD en acción.","Los comandos aparecen por necesidad, no como inventario.","LINE,PLINE,RECTANGLE,CIRCLE,MOVE,COPY,ROTATE,SCALE,MIRROR,TRIM"],["70–90","Ejercicio.","Cada alumno crea una figura bidimensional propia. No puede copiar una referencia. La convierte en módulo y genera una composición mediante una regla elegida."]],"book":"Wucius Wong · fundamentos del diseño bidimensional. Cada concepto se demuestra inmediatamente dentro del ejercicio.","checks":["Diferenciar creación de representación/copia","Explicar punto, línea, plano y forma","Introducir módulo y reglas de composición","Aplicar comandos básicos dentro del ejercicio","Cerrar con Composición 01 · Módulo y repetición"]},"1-2":{"title":"Módulo, variación y macromódulo","sub":"Wong + AutoCAD","objective":"Descubrir que una composición puede adquirir complejidad sin perder una lógica interna.","blocks":[["0–10","Lectura colectiva.","Revisar trabajos sin calificarlos como bonito/feo. Preguntar: ¿qué se repite?, ¿qué regla existe?, ¿dónde está la jerarquía?"],["10–30","Wong.","Módulo → submódulo → macromódulo. Repetición, semejanza, gradación, radiación, contraste, concentración y anomalía."],["30–65","AutoCAD.","Las capas nacen para organizar el sistema: forma base, módulo, macromódulo, vacío y ejes.","ARRAY,OFFSET,STRETCH,FILLET,CHAMFER,HATCH,LAYER"],["65–90","Ejercicio.","Transformar la composición anterior incorporando módulo original, variación, macromódulo, contraste y una anomalía intencional."]],"book":"Wucius Wong · módulo, estructura, repetición y variación.","checks":["Revisar trabajos mediante reglas, no gusto personal","Explicar módulo, submódulo y macromódulo","Trabajar variación, contraste y anomalía","Introducir capas como estructura del archivo","Cerrar con Composición 02 · Sistema y variación"]},"1-3":{"title":"De la composición al espacio","sub":"Wong → Ching → Neufert","objective":"Tender el primer puente Wong → Ching: comprender que una relación gráfica puede comenzar a convertirse en una relación espacial.","blocks":[["0–15","Provocación.","¿Qué ocurre si la composición deja de ser dibujo? ¿Qué es lleno? ¿Qué es vacío? ¿Qué podría recorrerse? ¿Qué puede convertirse en límite?"],["15–35","Ching.","Forma y espacio, figura/fondo, elementos que definen espacio, relaciones entre formas y organización espacial. Relacionar módulo → elemento; composición → organización; contraste → jerarquía; repetición → ritmo; vacío → espacio."],["35–55","Lenguaje técnico.","Planta, corte, elevación, línea, jerarquía de línea y escala. La computadora dibuja en tamaño real; la escala pertenece a la representación."],["55–75","Precisión en AutoCAD.","Introducir coordenadas y dimensión real.","UNITS,DIST,OSNAP,ORTHO,POLAR"],["75–90","Ejercicio.","Asignar escala física al macromódulo. Comparar qué sucede si una pieza mide 20 cm, 1 m, 3 m o 10 m. Introducir Neufert como diccionario dimensional."]],"book":"Ching · Forma, espacio y orden + Manual de dibujo técnico. Consulta: Neufert para cuerpo–objeto–espacio y dimensiones.","checks":["Transformar lleno/vacío en preguntas espaciales","Conectar Wong con Forma, espacio y orden","Introducir planta, corte, elevación y escala","Trabajar precisión y dimensiones reales en AutoCAD","Presentar Neufert como diccionario dimensional"]}}
for(let w=2;w<=12;w++)for(let c=1;c<=3;c++)lessons[`${w}-${c}`]={title:`Semana ${w} · Clase ${c}`,sub:'Pendiente de desarrollar',objective:'Esta clase se desarrollará sobre la misma estructura.',blocks:[],book:'',checks:[]};
const done=id=>localStorage.getItem('dtp-done-'+id)==='1';
function render(){const root=document.getElementById('calendar');root.innerHTML='';for(let w=1;w<=12;w++){const row=document.createElement('div');row.className='week';row.innerHTML=`<div class="weeklabel"><b>${String(w).padStart(2,'0')}</b><span>SEMANA ${w}</span></div>`;for(let c=1;c<=3;c++){const id=`${w}-${c}`,d=lessons[id],slot=document.createElement('div');slot.className='slot';slot.innerHTML=`<button class="card ${done(id)?'done':''}" data-id="${id}"><span class="mark"></span><span class="kicker">CLASE ${String(c).padStart(2,'0')}</span><span class="title">${d.title}</span><span class="sub">${d.sub}</span><span class="date">Fecha: <input type="date" value="${localStorage.getItem('dtp-date-'+id)||''}"></span></button>`;const card=slot.querySelector('.card'),inp=slot.querySelector('input');card.onclick=e=>{if(e.target!==inp)openLesson(id)};inp.onclick=e=>e.stopPropagation();inp.onchange=e=>localStorage.setItem('dtp-date-'+id,e.target.value);row.appendChild(slot)}root.appendChild(row)}progress()}
function openLesson(id){const d=lessons[id];modalKicker.textContent=`SEMANA ${id.split('-')[0]} · CLASE ${id.split('-')[1]}`;modalTitle.textContent=d.title;const blocks=d.blocks.length?d.blocks.map(b=>`<div class="row"><div class="time">${b[0]}</div><div><b>${b[1]}</b><div>${b[2]}</div>${b[3]?`<div class="commands">${b[3].split(',').map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div></div>`).join(''):'<p class="empty">Clase pendiente de desarrollar.</p>';const checks=d.checks.map((x,i)=>`<label><input type="checkbox" ${localStorage.getItem(`dtp-check-${id}-${i}`)==='1'?'checked':''} data-i="${i}"> ${x}</label>`).join('');modalBody.innerHTML=`<div class="complete"><b>Clase realizada</b><input id="complete" type="checkbox" ${done(id)?'checked':''}></div><div class="callout"><b>Objetivo</b><div>${d.objective}</div></div>${blocks}${d.book?`<div class="book"><b>Bibliografía</b><div>${d.book}</div></div>`:''}${checks?`<div class="checks">${checks}</div>`:''}`;complete.onchange=e=>{localStorage.setItem('dtp-done-'+id,e.target.checked?'1':'0');render()};modalBody.querySelectorAll('.checks input').forEach(el=>el.onchange=e=>localStorage.setItem(`dtp-check-${id}-${e.target.dataset.i}`,e.target.checked?'1':'0'));backdrop.classList.add('open')}
function progress(){let n=0;for(let w=1;w<=12;w++)for(let c=1;c<=3;c++)if(done(`${w}-${c}`))n++;progressText.textContent=`${n} / 36`;progressFill.style.width=`${n/36*100}%`}
close.onclick=()=>backdrop.classList.remove('open');backdrop.onclick=e=>{if(e.target===backdrop)backdrop.classList.remove('open')};render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body></html>
