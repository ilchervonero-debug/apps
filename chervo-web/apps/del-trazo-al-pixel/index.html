<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c83a2d"><meta name="mobile-web-app-capable" content="yes"><title>Del Trazo al Píxel</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.svg"><style>:root{--r:#c83a2d;--i:#202124;--m:#6d7378;--l:#d9dddf;--w:#f8eeeb;--d:#9aa0a4}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f4;color:var(--i)}.top{background:linear-gradient(105deg,var(--r),#9f2e27);color:#fff;padding:18px 22px}.brand{font-size:28px;font-weight:900;line-height:.92}.brand small{display:block;font-size:11px;margin-top:8px}.main{max-width:1280px;margin:auto;padding:16px}.progressbox,.calendar{background:#fff;border:1px solid var(--l);border-radius:12px;margin-bottom:14px;overflow:hidden}.progressbox{padding:13px 15px}.progresshead{display:flex;justify-content:space-between}.bar{height:9px;background:#e6e9ea;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--r)}.head,.week{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr))}.head{background:#eceff0;font-size:12px;font-weight:800}.head div,.weeklabel,.slot{padding:10px;border-right:1px solid var(--l)}.week{border-top:1px solid var(--l);min-height:122px}.weeklabel{background:#f7f8f8}.weeklabel b{display:block;color:var(--r);font-size:18px}.weeklabel span,.sub,.date{font-size:10px;color:var(--m)}.card{width:100%;height:100%;min-height:102px;text-align:left;border:1px solid #e2c5bf;background:var(--w);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative}.card.done{background:#eceeef;border-color:#d3d7d9;color:#73777a}.kicker{font-size:10px;font-weight:800;color:var(--r)}.title{font-size:14px;font-weight:800;padding-right:24px}.sub{margin-top:auto}.date input{border:0;border-bottom:1px dashed #aaa;background:transparent;width:118px}.mark{position:absolute;right:8px;top:8px;width:20px;height:20px;border:2px solid var(--r);border-radius:50%}.done .mark{background:var(--d);border-color:var(--d)}.done .mark:after{content:'✓';color:#fff;display:grid;place-items:center;font-size:12px}.backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.backdrop.open{display:flex}.modal{width:min(850px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px}.mhead{position:sticky;top:0;background:linear-gradient(105deg,var(--r),#9f2e27);color:#fff;padding:15px 17px;display:flex;justify-content:space-between}.mhead h2{margin:3px 0 0}.close{border:0;background:#ffffff22;color:#fff;border-radius:50%;width:34px;height:34px}.body{padding:17px}.complete{display:flex;justify-content:space-between;background:#f6f7f7;border:1px solid var(--l);border-radius:10px;padding:11px;margin-bottom:13px}.callout{background:var(--w);border-left:4px solid var(--r);padding:12px;border-radius:8px}.row{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.time{font-weight:800;color:var(--r)}.commands span{display:inline-block;border:1px solid var(--l);border-radius:6px;padding:3px 6px;margin:4px;font-family:monospace}.book{margin-top:13px;background:#f6f8f8;border:1px solid var(--l);padding:12px;border-radius:9px}.checks{display:grid;gap:7px;margin-top:13px}@media(max-width:820px){.calendar{overflow:auto}.head,.week{grid-template-columns:78px repeat(3,230px);min-width:768px}}.prog{margin:11px 0;padding:11px 0;border-bottom:1px solid #eee}.prog:last-child{border-bottom:0}.prog b{display:block;margin-bottom:3px;font-size:15px}.prog div{font-size:14px}.secttl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--m);margin:18px 0 2px}.taller{background:var(--w);border-left:4px solid var(--r);border-radius:8px;padding:13px 15px;margin:14px 0 4px}.taller h4{margin:0 0 9px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--r);font-weight:800}.taller p{margin:0 0 10px;font-size:15px;line-height:1.55}.taller p:last-child{margin-bottom:0}.taller p.tarea{background:#fff;border-radius:8px;padding:10px 12px;border:1px solid var(--l)}.taller p.tarea b{color:var(--r);display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}.entrega-badge{display:inline-block;background:var(--r);color:#fff;font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}.notes{margin-top:16px;padding-top:14px;border-top:2px dashed var(--l)}.notes>b{display:block;font-size:15px;margin-bottom:2px}.notes-sub{display:block;font-size:12px;color:var(--m);margin-bottom:8px}.notes textarea{width:100%;min-height:110px;border:1px solid var(--l);border-radius:8px;padding:10px 12px;font:14px/1.5 Arial,sans-serif;color:var(--i);background:#fbfbfb;resize:vertical;box-sizing:border-box}.notes textarea:focus{outline:2px solid var(--r);outline-offset:1px;background:#fff}</style></head><body><header class="top"><div class="brand">DEL TRAZO<br>AL PÍXEL<small>GUÍA DOCENTE · 12 SEMANAS</small></div><p>36 clases · 90 min: 60 programa + 30 taller · cada alumno desarrolla su propia casa</p></header><main class="main"><section class="progressbox"><div class="progresshead"><b>AVANCE DEL CURSO</b><span id="progressText"></span></div><div class="bar"><div class="fill" id="progressFill"></div></div></section><section class="calendar"><div class="head"><div>SEMANA</div><div>CLASE 1</div><div>CLASE 2</div><div>CLASE 3</div></div><div id="calendar"></div></section></main><div class="backdrop" id="backdrop"><article class="modal"><header class="mhead"><div><small id="modalKicker"></small><h2 id="modalTitle"></h2></div><button class="close" id="close">×</button></header><div class="body" id="modalBody"></div></article></div><script>
const lessons={"1-1":["Diseñar antes de dibujar","Wong + AutoCAD","Romper la asociación dibujar = copiar, y dejar claro desde hoy que todo lo que se aprenda en AutoCAD tiene un destino concreto: su propia casa, que arranca en esta clase.",[["Apertura","Proyecto transversal. Representar lo existente vs diseñar lo inexistente."],["Wong","Todo dibujo bidimensional se construye con cuatro elementos: el punto (marca una posición, sin dimensión), la línea (conecta dos puntos y tiene dirección), el plano (una superficie cerrada con área) y la forma (la silueta reconocible que resulta de combinarlos). La composición aparece cuando estas decisiones se repiten bajo una regla: traslación (mover sin cambiar), rotación (girar sobre un eje), reflejo (espejar) o escala (agrandar o achicar). Unidad + regla sostenida = módulo. Contraste y ritmo son el resultado de cómo se alternan repetición y variación."],["Entorno de trabajo","La interfaz de AutoCAD, la hoja configurada en metros (unidades reales, no de papel) y el plano cartesiano — origen, ejes X/Y, coordenadas. Esta base se va a repetir con cada programa nuevo: primero saber dónde estás parado, después dibujar."],["Herramientas de dibujo","Crean geometría nueva — sumamos HATCH para distinguir un módulo de otro por relleno, no solo por contorno.","LINE,PLINE,RECTANGLE,CIRCLE,HATCH"],["Herramientas de edición","Modifican lo que ya existe. Comandos por necesidad, no inventario — sumamos GROUP: agrupar un módulo (o un macromódulo entero) para poder moverlo, copiarlo o rotarlo como una sola pieza, sin desarmarlo.","MOVE,COPY,ROTATE,SCALE,MIRROR,TRIM,GROUP"],["Ejercicio","Figura bidimensional propia → módulo → composición con regla elegida."],["3D (SketchUp)","El último tramo (20 min) se arma el mismo módulo en volumen — Wong tiene fundamentos para 2D y para 3D, y la misma regla de repetición se reconoce en el espacio, no solo en el papel. 40 min en AutoCAD, 20 en SketchUp: no es práctica de la herramienta todavía, es ver el mismo concepto desde otro lado."]],"Wucius Wong · fundamentos del diseño bidimensional.","Composición 01 · Módulo y repetición",["No se les entrega un programa armado: se construye con ellos. La pregunta de partida no es «¿cuántos m² tiene tu casa?» sino «¿para quién es, y qué hace esa persona en su día?». De ahí se deriva el programa — dormir necesita dormitorio, cocinar necesita cocina, pero también hay que preguntar lo menos obvio: ¿trabaja desde casa?, ¿recibe visitas seguido?, ¿vive con mascotas? Un programa copiado de una casa cualquiera no sirve; uno bueno responde a ese usuario en particular.","Elegir un sitio real o verosímil y escribir 5–8 líneas describiendo quién vive ahí y qué necesita — todavía sin lista de ambientes, esa se arma en el próximo taller."]],"1-2":["Módulo, variación y macromódulo","Wong + AutoCAD","Construir complejidad manteniendo lógica interna.",[["Lectura colectiva","¿Qué se repite? ¿qué regla existe? ¿dónde está la jerarquía?"],["Wong","Un módulo se puede agrupar en submódulos más chicos o combinarse en macromódulos más grandes sin perder la regla que lo originó. Semejanza (variaciones leves de una misma unidad), gradación (cambio progresivo de tamaño o forma), radiación (repetición desde un centro), contraste y anomalía (una unidad que rompe la regla a propósito, para marcar jerarquía) son las formas de complejizar un sistema sin que deje de leerse como sistema."],["AutoCAD","Capas como estructura del sistema.","ARRAY,OFFSET,STRETCH,FILLET,CHAMFER,HATCH,LAYER"],["Ejercicio","Evolucionar composición con variación, macromódulo, contraste y anomalía."],["3D (SketchUp)","Últimos 20 min: se muestra cómo el macromódulo de hoy se lee distinto en volumen que en planta — la variación que en 2D es un cambio de figura, en 3D puede ser un cambio de altura o de profundidad. 40 min AutoCAD, 20 min SketchUp — se sigue sin practicar la herramienta en serio, eso es en la semana 6."]],"Wucius Wong · módulo, estructura, repetición y variación.","Composición 02 · Sistema y variación",["Se revisa lo que trajeron: ¿la descripción del usuario ya sugiere una regla de organización? Si recibe visitas seguido, quizás la casa necesite repetir un mismo ancho de circulación como módulo que conecta lo público y lo privado. La idea es que módulo y repetición no se apliquen a una figura abstracta, sino al primer esquema de organización del sitio: por dónde entra el sol, por dónde se entra, qué franja se repite en el terreno.","Dibujar un esquema simple del sitio (todavía no la casa) marcando una regla de organización — ejes, franjas o una grilla — que después va a ordenar el programa."]],"1-3":["De la composición al espacio","Wong → Ching → Neufert","Convertir relaciones gráficas en relaciones espaciales.",[["Provocación","¿Qué es lleno, vacío, recorrido y límite?"],["Ching","Forma/espacio, figura/fondo, organización, jerarquía y ritmo."],["Lenguaje técnico","Planta, corte, elevación, jerarquía de línea y escala."],["Precisión","Dimensión real y ayudas de dibujo.","UNITS,DIST,OSNAP,ORTHO,POLAR"],["Ejercicio","Asignar escala física al macromódulo y contrastar dimensiones con Neufert."],["3D (SketchUp)","Últimos 20 min: el diagrama de relaciones que hoy se dibuja en 2D se prueba también como masas simples en volumen — ver si la organización que parece resuelta en el papel se sostiene cuando hay que pararse adentro. 40 min AutoCAD, 20 min SketchUp — el puente más natural a 3D de toda la semana."]],"Ching · Forma, espacio y orden + Manual de dibujo técnico + Neufert.","Puente composición → espacio",["Con el sitio esquematizado, se arma recién ahora la lista de ambientes, pero ordenada por relación, no por tamaño: qué va junto a qué (cocina-comedor), qué necesita separarse (dormitorios y zona social), qué depende del contexto (un dormitorio no debería mirar a la calle si hay mucho ruido). Se cruza esto con una primera lectura del sitio: orientación, accesos, vecinos, arbolado.","Armar el diagrama de relaciones (círculos y líneas, sin medidas todavía) y anotar 3 medidas de Neufert para los ambientes ya definidos — no para llenar la casa entera, solo para no arrancar a ciegas."]],"2-1":["Mirar antes de medir","Relevamiento + percepción","Aprender a leer un lugar antes de reducirlo a medidas.",[["Lectura del sitio","Uso, recorrido, límites, luz, accesos, visuales y conflictos."],["Croquis","Croquis libre como instrumento de pensamiento; proporción antes que exactitud."],["Método de relevamiento","Secuencia: esquema general, medidas totales, parciales, diagonales, alturas, aberturas y fotos."],["Dibujo técnico","Convenciones básicas del croquis de relevamiento y cadena de cotas."],["Preparación","Definir equipos, instrumentos y hoja de campo."]],"Ching · lectura de forma y espacio. Manual de dibujo técnico · croquis y acotación. Neufert · contraste dimensional.","Ficha de relevamiento",["El método de relevamiento que se ve hoy en el programa se aplica directo al sitio propio, no es un ejercicio aparte: croquis del terreno con sus límites reales, accesos, orientación y lo que ya existe (árboles, desniveles, construcciones vecinas). La entrega obligatoria es en dos clases más — hoy se define qué van a mostrar: sitio, programa (el diagrama de la clase anterior) y una primera imagen gráfica, aunque sea un boceto.","Relevar el sitio con el método visto en el programa — medidas totales, parciales y diagonales de control."]],"2-2":["Relevar el espacio real","Campo + croquis","Obtener información suficiente para reconstruir el lugar sin volver a medir.",[["Estrategia","Asignar recorrido y orden de captura."],["Campo","Medir perímetro, espesores, aberturas, alturas, diagonales y elementos fijos; registrar orientación y fotografías."],["Control","Cerrar cadenas de medidas y detectar contradicciones en sitio."],["Síntesis","Croquis final legible y numeración de fotografías."]],"Manual de dibujo técnico · levantamiento y acotación. Neufert · dimensiones de referencia.","Relevamiento completo",["Se revisa el relevamiento: ¿cierran las medidas? ¿hay contradicciones entre lo medido en distintos puntos? Conviene resolver esas dudas a mano antes de pasar a CAD. Se hace un ensayo corto de la presentación — cada uno cuenta en un minuto su sitio, su usuario y su programa, para no improvisar en el momento de la entrega.","Cerrar el relevamiento y dejar listo el material gráfico (croquis, fotos) para la presentación."]],"2-3":["Del croquis al CAD","AutoCAD técnico","Transformar datos de campo en una planta verificable sin perder trazabilidad.",[["Orden","Crear archivo, unidades y capas: existente, muros, aberturas, cotas, textos, ejes."],["Construcción","Dibujar perímetro y espesores desde medidas reales.","UNITS,LAYER,PLINE,OFFSET,TRIM,EXTEND,FILLET"],["Aberturas y control","Insertar huecos, comprobar diagonales y distancias.","DIST,OSNAP"],["Acotación","Primera planta del estado actual con cotas y nombres.","DIM,MTEXT"]],"Manual de dibujo técnico · planta y acotación.","Planta existente v01",["Presentación obligatoria: sitio, programa (diagrama de relaciones) y un primer acercamiento gráfico — no un diseño resuelto, una intención legible. Se evalúa que se entienda la lógica, no que esté terminado. La devolución grupal es para todos: por cada proyecto se discute qué se entendió y qué quedó ambiguo, así aprenden a detectar cuándo un programa no tiene argumento propio.","Ajustar lo que la devolución marcó, antes de pasar el sitio a CAD la próxima semana."],"Entrega obligatoria"],"3-1":["Representar lo existente","Planta + jerarquía gráfica","Hacer que el dibujo técnico comunique, no solo que sea geométricamente correcto.",[["Jerarquía","Corte, proyección, fondo; pesos y tipos de línea."],["AutoCAD","Capas, propiedades y bloques simples.","LAYER,LTYPE,LINEWEIGHT,BLOCK,BEDIT"],["Información","Textos, cotas, símbolos y nomenclatura."],["Crítica","Leer planos sin explicación oral: ¿qué se entiende y qué no?"]],"Manual de dibujo técnico · normas de representación.","Planta existente limpia",["Pasar el relevamiento a CAD no es calcar el croquis: es decidir qué información importa y con qué jerarquía de línea se dibuja (gruesa = corte, fina = proyección). Se revisa capa por capa: sitio, límites, elementos existentes.","Armar la planta del sitio en CAD y preguntarse: si alguien la mira sin que vos expliques nada, ¿entiende dónde está el frente, el acceso y los límites?"]],"3-2":["Cortar para comprender","Cortes + elevaciones","Usar el corte para revelar altura, espesor, nivel y relación espacial.",[["Ching","Plano vertical, sección y relación entre planta y corte."],["Construcción","Proyectar dos cortes desde la planta.","XLINE,LINE,OFFSET,TRIM,HATCH"],["Niveles","Piso, dintel, cielorraso, cubierta y cotas verticales."],["Elevación","Construir una elevación principal y comparar información."]],"Ching · elementos definidores del espacio. Manual técnico · cortes/elevaciones.","2 cortes + 1 elevación",["Si el terreno tiene desnivel, contexto construido cerca, o algo que solo se entiende en corte (un muro, un árbol grande), se dibuja un corte. No todos los sitios lo necesitan — se decide según lo que el terreno realmente tenga.","Resolver un corte del sitio propio si aplica, o documentar niveles con cotas si el terreno es plano."]],"3-3":["Escala y lámina","Layout + impresión","Entender que se dibuja 1:1 y se comunica mediante escala y composición de lámina.",[["Escala","1:20, 1:50, 1:100: qué información corresponde a cada una."],["Paper Space","Layout, viewport y escala gráfica.","LAYOUT,MVIEW,ZOOM,PLOT"],["Composición","Jerarquía de títulos, dibujos, vacíos y rótulo."],["Salida","PDF de estado actual y control de lectura."]],"Manual de dibujo técnico · escalas y presentación.","Lámina 01 · Estado actual",["Se arma la primera lámina: no es un dibujo suelto, es una pieza de comunicación con escala, título y orden de lectura. La pregunta guía es: si esta lámina fuera lo único que alguien viera de tu proyecto hasta ahora, ¿qué entendería?","Exportar PDF y revisar en pantalla completa — los errores de escala o de lectura se ven recién ahí, no en el dibujo a mano alzada."]],"4-1":["Programa y usuario","Ching + Neufert","Convertir necesidades humanas en un programa espacial, no en una lista de muebles.",[["Usuario","Quién usa, cuándo, cómo y con quién."],["Programa","Actividad → requerimiento → relación → dimensión."],["Neufert","Consultar medidas como referencia, no como receta."],["Diagrama","Burbujas de relaciones, proximidad, incompatibilidades y jerarquías."]],"Ching · organización espacial. Neufert · dimensiones humanas y funcionales.","Programa + diagrama de relaciones",["Ahora sí se define el programa completo de su casa, con Neufert al lado pero no como receta — se consulta una medida cuando hace falta, no se copia una casa tipo de un libro. La pregunta de esta consulta: cada ambiente que pusiste, ¿lo pusiste porque tu usuario lo necesita, o porque «toda casa tiene uno»?","Diagrama de relaciones definitivo, con superficies aproximadas."]],"4-2":["Partido: una regla para decidir","Wong → arquitectura","Recuperar módulo, ritmo, contraste y jerarquía para construir una idea rectora.",[["Regreso a Wong","¿Qué regla de las primeras composiciones puede gobernar el proyecto?"],["Ching","Organizaciones central, lineal, radial, agrupada y trama."],["Alternativas","Producir tres partidos diferentes sobre la planta existente."],["Crítica","Defender cada alternativa por su regla, no por gusto."],["3D (SketchUp)","20 min al final: de las tres alternativas de partido, se arma una en volumen simple para verificar que la regla elegida se sostiene en el espacio y no solo en la planta — ayuda a descartar o defender alternativas con algo más que el dibujo. 40 min AutoCAD, 20 min SketchUp."]],"Wong · estructura y composición. Ching · organizaciones de la forma y el espacio.","3 alternativas de partido",["Se arman tres partidos distintos — no tres variaciones del mismo, tres ideas realmente diferentes de organizar la casa, cada una gobernada por una regla reconocible (las de Wong de la semana 1: módulo, eje, trama, radial). Cada alumno defiende sus tres partidos ante un compañero antes de elegir.","Bocetar los tres partidos y anotar, para cada uno, cuál es la regla que lo organiza."]],"4-3":["Elegir y argumentar","Anteproyecto 01","Seleccionar una propuesta mediante criterios explícitos y comenzar a dimensionarla.",[["Matriz","Uso, circulación, luz, estructura, identidad y viabilidad."],["AutoCAD","Desarrollar alternativa elegida con medidas reales y mobiliario de control.","COPY,MOVE,STRETCH,OFFSET,BLOCK"],["Neufert","Comprobar pasos, giros, equipamiento y ergonomía."],["Cierre","Escribir concepto en tres frases y señalar decisiones en planta."],["3D (SketchUp)","20 min al final: antes de argumentar el partido elegido, un vistazo más armado en volumen — defenderlo con una masa además de una planta cambia lo que se puede decir de él. 40 min AutoCAD, 20 min SketchUp."]],"Neufert · ergonomía. Ching · relaciones espaciales.","Anteproyecto v01 + concepto",["Se elige uno de los tres partidos con una matriz simple: uso, circulación, luz, viabilidad constructiva. No se elige el que más gusta — se elige el que mejor responde al usuario definido en la semana 1.","Primeras medidas reales sobre el partido elegido — Anteproyecto 01."]],"5-1":["Planta de propuesta","AutoCAD + función","Pasar del partido a una planta arquitectónica coherente y habitable.",[["Revisión","Concepto vs programa: detectar contradicciones."],["Desarrollo","Muros, aberturas, circulaciones, equipamiento y relaciones.","OFFSET,TRIM,STRETCH,MATCHPROP,BLOCK"],["Chequeo","Dimensiones críticas con Neufert."],["Crítica","¿Dónde se reconoce la idea rectora en la planta?"]],"Ching + Neufert + Manual técnico.","Planta propuesta v02",["La planta definitiva empieza a tomar medidas reales: muros, aberturas, circulación. Se revisa contra Neufert solo lo crítico — pasos, giro de puertas, distancias mínimas de uso — no la casa entera dimensión por dimensión.","Planta con medidas reales de su casa."]],"5-2":["Cortes de propuesta","Espacio vertical","Diseñar también en sección: alturas, luz, compresión, expansión y continuidad.",[["Ching","Escala, proporción, plano superior y abertura."],["Cortes","Construir cortes sobre lugares donde la propuesta toma decisiones."],["Iteración","Modificar planta si el corte revela problemas."],["Anotación","Niveles, materiales preliminares y relación con existente."]],"Ching · escala/proporción y elementos definidores. Manual técnico.","2 cortes de propuesta",["Los cortes se hacen donde la propuesta realmente toma una decisión — un desnivel, una doble altura, una relación con el sitio — no en cualquier lugar para completar la lámina. Si el corte revela un problema en la planta, se vuelve a la planta: el corte manda tanto como ella.","Dos cortes de su casa en los puntos que importan."]],"5-3":["Fachada, material y ritmo","Elevación + composición","Entender la elevación como composición vinculada al espacio, no como decoración.",[["Wong","Ritmo, repetición, contraste, gradación y anomalía en fachada."],["Elevación","Aberturas, llenos, vacíos y alineaciones."],["Material","Asignar una paleta preliminar según función y concepto."],["Entrega","Coordinar planta, cortes y elevación."]],"Wong + Ching · forma, abertura, superficie.","Anteproyecto coordinado",["La fachada se piensa como composición, no como decoración final: ritmo de aberturas, llenos y vacíos, relación directa con el partido elegido en la semana 4. Se define una paleta de materiales preliminar, no definitiva pero con una intención clara.","Coordinar planta + cortes + fachada en un solo archivo — Anteproyecto coordinado."]],"6-1":["Entrar en tres dimensiones","Wong tridimensional + SketchUp","Comprender SketchUp como espacio de diseño — no un programa suelto para aprender, sino la herramienta con la que van a modelar en volumen la misma casa que ya vienen desarrollando en AutoCAD.",[["Entorno de trabajo","La interfaz de SketchUp, unidades en metros, y el equivalente del plano cartesiano en 3D: los tres ejes (X/Y/Z) y cómo el programa infiere la dirección mientras se dibuja — mismo concepto que el plano de AutoCAD, con una dimensión más."],["Herramientas de dibujo","Crean geometría — mismo verbo, mismo ícono que en AutoCAD para varias.","Line,Rectangle,Circle,Arc"],["Herramientas de edición","Modifican lo existente — reconocibles de AutoCAD, más una sin equivalente 2D.","Move,Copy,Rotate,Scale,Push/Pull"],["Wong 3D","Planos seriados, estructuras de pared, prismas, módulos y relaciones volumétricas."],["Ejercicio","Construir una composición espacial abstracta desde el módulo de Semana 1 — vacío, masa, recorrido, jerarquía y escala."]],"Wucius Wong · fundamentos del diseño tridimensional.","Composición 3D",["Se levanta el primer volumen simple de su casa en SketchUp — mismo patrón entorno→dibujo→edición que en AutoCAD, ahora en volumen.","Primer volumen simple de su casa en SketchUp."]],"6-2":["Modelar lo existente","SketchUp + organización","Construir un modelo verificable del relevamiento manteniendo orden y editabilidad.",[["Preparación","Importar/usar planta como referencia y fijar unidades."],["Modelo","Muros, pisos, huecos y alturas."],["Orden","Grupos, componentes, tags y outliner."],["Control","Comparar modelo contra cortes y medidas."]],"Manual técnico + documentación propia del relevamiento.","Modelo 3D existente",["Se modela el sitio propio: terreno, entorno inmediato, alturas de referencia (vecinos, árboles). Sin esto, el modelo de la casa después queda flotando sin contexto real.","Modelo del sitio con la topografía o el desnivel, si existe."]],"6-3":["Modelar la propuesta","SketchUp + iteración","Usar el modelo para evaluar y corregir el anteproyecto.",[["Separación","Existente vs nuevo; organización por grupos/tags."],["Propuesta","Modelar operaciones principales, aberturas y equipamiento esencial."],["Escenas","Crear vistas equivalentes para comparar alternativas."],["Crítica","Corregir escala, proporción y recorrido desde el modelo."]],"Ching · escala, proporción y recorrido.","Modelo propuesta v01",["Se modela la propuesta sobre el sitio ya modelado, organizada en grupos o tags para poder mostrar y ocultar existente/propuesta por separado.","Modelo propuesta v01, con la planta ya definida como base."]],"7-1":["Modelar en Revit","Revit (no BIM)","Aprender un tercer programa con el mismo esquema de siempre, para resolver algo concreto que AutoCAD y SketchUp no resuelven juntos: que su plano y su modelo dejen de desincronizarse.",[["Por qué otro programa","SketchUp modela rápido y libre pero no genera documentación; AutoCAD documenta con precisión pero no modela en 3D. Revit hace ambas cosas desde el mismo archivo — se usa acá solo como modelador + generador de planos, sin la capa de información constructiva que trae por defecto: esa parte queda fuera a propósito."],["Entorno de trabajo","La interfaz de Revit, unidades en metros, y su versión del plano de referencia: los niveles — alturas fijas (planta baja, primer piso) sobre las que se apoya todo lo demás, en vez de dibujar libre en cualquier altura."],["Herramientas de dibujo","Crean geometría — pero ya no es una línea neutra: cada objeto sabe qué es.","LEVEL,WALL,DOOR,WINDOW"],["Herramientas de edición","Modifican lo existente — mismo lenguaje que ya conocen de AutoCAD y SketchUp.","MOVE,COPY,ALIGN,TRIM"]],"Manual de dibujo técnico · convenciones que ahora genera el programa en vez de dibujarse a mano.","Modelo Revit v01",["Se levanta en Revit el partido que ya está definido desde la semana 4-5 — niveles, muros exteriores, la losa de piso. No es un modelo nuevo: es el mismo proyecto, en el tercer programa del mismo patrón.","Niveles y muros exteriores de su casa en Revit, sobre el partido ya elegido."]],"7-2":["De modelo a plano","Revit (no BIM)","Ver en vivo cómo una planta y un corte salen del mismo modelo, ya coordinados — el corazón de por qué se suma esta herramienta.",[["Vista en planta","Una planta en Revit no se dibuja: es un corte horizontal automático del modelo a la altura que se defina. Si el modelo cambia, la planta cambia sola."],["Vista en corte","Lo mismo para un corte — se traza una línea de corte sobre la planta y Revit genera la vista vertical correspondiente, con el mismo nivel de detalle que la planta.","SECTION,LEVEL"],["La prueba","Se mueve un muro en el modelo y se mira la planta: cambió sola, sin volver a dibujar nada. Esa es la diferencia real con el camino AutoCAD+SketchUp, donde ese mismo cambio hay que repetirlo a mano en cada vista."]],"Manual de dibujo técnico · relación planta-corte-elevación, ahora automática.","Planta y corte v01 desde Revit",["Se genera la planta y un corte de su propia casa directo desde el modelo de la clase anterior, y se compara contra la planta que dibujaron a mano en AutoCAD en la semana 5 — ¿coinciden? Si no, ¿cuál está bien?","Sacar planta + 1 corte de su modelo Revit y confrontarlos con su documentación AutoCAD de la semana 5."]],"7-3":["Completar el modelo","Revit (no BIM)","Terminar de levantar la casa completa en Revit — todos los ambientes, todas las aberturas — para tener el proyecto entero en un solo archivo coordinado.",[["Repetir sin redibujar","Copiar un muro con puertas y ventanas ya insertadas repite todo el conjunto — muy parecido a COPY en AutoCAD, pero acá el hueco de la abertura viaja con la copia."],["Chequeo cruzado","Con el modelo completo, se revisan las medidas críticas (Neufert) directamente sobre la vista en planta que genera el programa, no sobre un dibujo aparte."]],"Neufert · dimensiones humanas y funcionales, verificadas ahora sobre el modelo.","Modelo Revit completo",["Se completa el modelo de su casa entera en Revit — todos los muros, aberturas y niveles que ya tienen resueltos en AutoCAD desde la semana 5.","Modelo Revit completo de su casa, con todas las aberturas."]],"8-1":["Espacio y recorrido en Revit","Ching + Revit","Definir el recorrido y las vistas 3D de la casa directamente sobre el modelo coordinado, igual que se haría en SketchUp pero sin perder la planta al mismo tiempo.",[["Ching","Aproximación, acceso, configuración del recorrido — los mismos conceptos de la semana 7 del curso original, ahora aplicados con una vista 3D que nunca se desincroniza de la planta."],["Cámaras","Se guardan 2-3 vistas 3D del recorrido de llegada — cada vista es una cámara fija dentro del modelo, no una escena aparte como en SketchUp.","3D VIEW"]],"Ching · aproximación, acceso y configuración del recorrido.","Vistas de recorrido en Revit",["Se definen 2-3 vistas de cámara del recorrido de llegada de su casa, directo sobre el modelo Revit de la semana anterior.","Guardar las vistas de recorrido de su casa en Revit."]],"8-2":["Componentes y documentación viva","Revit (no BIM)","Agregar solo los componentes que hacen falta para leer escala y uso, y verificar que la planta se sigue generando sola con cada cambio.",[["Qué modelar","Igual que en SketchUp: mobiliario esencial, puertas, ventanas — no hay que llenar la casa de objetos para que se entienda."],["La planta sigue vidente","Cada componente agregado aparece también en la planta automáticamente — es el mismo chequeo de la clase 7-2, ahora con el modelo completo."]],"Neufert · equipamiento y antropometría.","Modelo Revit equipado",["Se equipan los ambientes principales de su casa con mobiliario esencial en Revit, y se revisa que la planta generada automáticamente siga siendo correcta.","Equipar su casa en Revit y verificar la planta actualizada."]],"8-3":["Dos caminos, un proyecto","Comparación","Comparar en la propia experiencia los dos procesos posibles — AutoCAD+SketchUp por separado vs. Revit coordinado — sin declarar uno mejor que el otro en abstracto.",[["La pregunta","No es qué programa es mejor en general — es qué necesitó cada proyecto puntual: más libertad de forma (SketchUp) o más necesidad de que planta y modelo no se desincronicen (Revit)."],["Evidencia propia","Cada alumno compara su propia planta de AutoCAD (semana 5) contra la planta generada por Revit (semana 7) — dónde coinciden, dónde no, y por qué."]],"Síntesis de lo trabajado semanas 5 a 8.","Comparación de procesos",["Reflexión aplicada sobre su propio proyecto: ¿qué fue más rápido o más claro para SU casa, el camino AutoCAD+SketchUp o Revit? No hay respuesta correcta única — la respuesta depende del proyecto de cada uno.","Escribir 5 líneas comparando ambos procesos sobre su propia experiencia."]],"9-1":["Materialidad y luz","Materiales + Enscape/V-Ray","Definir la paleta de materiales y las condiciones de luz de la casa sobre el modelo — de SketchUp o de Revit, según el camino de cada uno.",[["Paleta","4 a 6 materiales elegidos por función, clima y relación con el partido — no por gusto estético solo, como ya se vio en la semana 7 del curso original."],["Luz real del sitio","Orientación real del sitio propio, no genérica: un dormitorio que necesita luz de mañana no debería quedar orientado igual que un living que la necesita de tarde."],["Luz artificial","Al comprimir la semana, la luz artificial no puede ser una clase aparte — se decide junto con la natural, no después: qué ambientes necesitan luz propia de noche y con qué temperatura de color, para no tener que rehacer la escena más tarde."]],"Ching · superficie y cualidades espaciales.","Paleta + estudio de luz",["Definir la paleta de materiales de su casa y probar 2-3 condiciones de sol reales sobre su sitio.","Paleta de materiales aplicada + condición de luz elegida."]],"9-2":["Primer render de prueba","Enscape / V-Ray","Configurar materiales PBR y sacar un render rápido para diagnosticar, no para que salga lindo todavía.",[["Pipeline","Modelo limpio → materiales → iluminación → cámara → render — el mismo orden sea el modelo de SketchUp o de Revit."],["PBR","Albedo, rugosidad, normal/bump y escala configurados para que se vean correctos tanto en Enscape (tiempo real) como en V-Ray (foto-realista)."],["Corrección","Materiales quemados, escalas falsas, sombras y exposición — se corrige antes de subir calidad."]],"Apoyo: principios físicos de materiales y observación de referencias reales.","Render de prueba 01",["Un render rápido de su casa y una lista de qué corregir — el objetivo es diagnosticar, no que salga lindo todavía.","Render de prueba de su casa + lista de correcciones."]],"9-3":["Render final: primera versión","Wong vuelve + contexto","Cerrar el círculo abierto en la semana 1: las mismas reglas de composición de Wong, ahora aplicadas al encuadre de la imagen final, no a una figura en el papel.",[["Wong vuelve","Campo visual, peso, contraste, dirección y equilibrio — los mismos criterios de la semana 1, aplicados ahora a qué llena el cuadro, hacia dónde tira la mirada, y qué balancea qué. Se decide el encuadre con esta lógica antes de renderizar en serio, no después."],["Variantes y selección","Se prueban 2-3 encuadres distintos del mismo espacio y se elige uno — no el más espectacular, el que mejor explica la propuesta con los criterios de Wong recién vistos."],["Contexto con criterio","Vegetación, personas y objetos solo si aportan lectura de escala o uso — todo lo que no aporta, se saca."]],"Wong · composición de la imagen. Neufert · escala humana como referencia de personas y contexto.","Render final v01",["Se eligen 2-3 encuadres de su casa y se selecciona el final aplicando la misma lógica de Wong de la semana 1 — peso, contraste, equilibrio — ahora sobre la imagen, no sobre el papel.","Encuadre final elegido + render final v01 de su casa."]],"10-1":["Postproducción con criterio","Corel PHOTO-PAINT","Mejorar lectura sin cambiar geometría ni inventar decisiones de proyecto.",[["Límites","Corrección vs falsificación."],["Ajustes","Ajustes de exposición, contraste, balance y correcciones locales en Corel PHOTO-PAINT — nunca agregar algo que no esté en el modelo."],["Contexto","Integración de personas/vegetación si corresponde."],["Comparación","Antes/después y justificación de cada ajuste."]],"Wong · contraste y jerarquía como control visual.","Render final v02",["Postproducción con límite claro: se puede ajustar exposición, contraste, balance — no se puede inventar una decisión de proyecto que no está en el modelo.","Comparar antes/después y justificar cada ajuste hecho."]],"10-2":["Volver del render al plano","Coordinación","Detectar inconsistencias reveladas por el 3D y corregir documentación.",[["Auditoría","Comparar planta, cortes, elevaciones y modelo."],["Corrección CAD","Aberturas, espesores, niveles, mobiliario y cotas."],["Control","Lista de inconsistencias resueltas."],["Salida","Actualizar láminas."]],"Manual de dibujo técnico · coordinación gráfica.","Documentación coordinada v02",["El 3D casi siempre revela algo que la planta no había resuelto. Quienes vienen de Revit llegan con planta y modelo ya coordinados desde la semana 7 — acá verifican que siga siendo así con los cambios de las últimas semanas. Quienes vienen de AutoCAD+SketchUp auditan y corrigen a mano las diferencias. Mismo objetivo para todos: que la planta y el modelo digan lo mismo.","Lista de inconsistencias encontradas y resueltas (o confirmación de que Revit ya venía coordinado)."]],"10-3":["Narrativa del proyecto","Concepto + secuencia","Construir un relato visual breve desde problema hasta solución.",[["Historia","Existente → problema → regla → propuesta → experiencia."],["Selección","Elegir solo dibujos e imágenes que sostienen el relato."],["Orden","Secuenciar láminas y jerarquías."],["Ensayo","Explicar proyecto en 3 minutos sin leer."]],"Ching + Wong como vocabulario para argumentar decisiones.","Guion de presentación",["Se arma el guion de presentación: de la observación del sitio al problema, a la regla, a la propuesta, a la imagen final — un hilo, no una sucesión de láminas sueltas.","Guion de presentación de su proyecto en 5 pasos."]],"11-1":["Diseñar la entrega","AutoCAD Layout → Illustrator/Corel","Componer la presentación como un sistema visual coherente con el proyecto.",[["Retícula","Márgenes, columnas, alineaciones y blancos."],["Jerarquía","Título, concepto, planos, imágenes y textos."],["Montaje","Base de la lámina armada en AutoCAD (Layout, a escala de salida); terminación gráfica — tipografía, jerarquía, color — en Illustrator o CorelDRAW."],["Prueba","Lectura a distancia y en pantalla."]],"Wong · estructura y equilibrio. Manual técnico · presentación.","Lámina final v01",["Se diseñan las láminas finales como sistema. Quienes tienen el modelo en Revit exportan planta y corte ya armados y coordinados; el resto arma la base en AutoCAD Layout a mano. Todos terminan la gráfica — tipografía, jerarquía, color — en Illustrator o CorelDRAW.","Montaje de la lámina final v01 de su casa."]],"11-2":["Corrección cruzada","Crítica entre pares","Aprender a detectar problemas ajenos para reconocerlos en el propio trabajo.",[["Reglas","Criticar decisiones y evidencia, no gustos."],["Pares","Cada alumno revisa claridad, función, dimensión, representación y narrativa de otro."],["Respuesta","Autor decide qué acepta y justifica qué mantiene."],["Plan","Lista priorizada de correcciones finales."]],"Síntesis de bibliografía del curso.","Lista de correcciones",["Reciben corrección de un compañero sobre su propio proyecto — la regla es criticar decisiones con evidencia, no gustos. Cada uno decide qué corrección acepta y por qué.","Lista priorizada de correcciones a aplicar antes de la entrega."]],"11-3":["Preentrega completa","Simulación","Probar el proyecto completo bajo condiciones de entrega real.",[["Montaje","PDF, imágenes y archivos listos."],["Presentaciones","Exposición cronometrada con preguntas."],["Diagnóstico","Tres correcciones imprescindibles por proyecto."]],"Toda la bibliografía como soporte de argumentación.","Preentrega",["Simulacro completo de entrega: presentación cronometrada de su casa, con preguntas, en condiciones reales.","Identificar las 3 correcciones imprescindibles que salieron del simulacro."]],"12-1":["Última coordinación","Control técnico","Cerrar errores sin rediseñar impulsivamente a último momento.",[["Checklist","Programa, medidas, coherencia gráfica y modelo."],["Correcciones","Resolver únicamente inconsistencias verificadas."],["Archivos","Nombres, versiones, vínculos y exportaciones."],["Bloqueo","Definir versión final."]],"Manual técnico + Neufert como control final.","Proyecto congelado para entrega",["Última consulta antes de cerrar: se resuelven solo las inconsistencias verificadas en el simulacro, no se rediseña de más a último momento.","Checklist final cerrado."]],"12-2":["Render y láminas finales","Producción final","Generar los archivos definitivos con calidad y consistencia.",[["Preparación","Resolución, formato y checklist."],["Producción","Renders finales y exportaciones CAD/PDF."],["Montaje","Sustituir pruebas por archivos finales."],["Verificación","Abrir todos los archivos como los recibirá el público."]],"Síntesis del curso.","Entrega final cerrada",["Producción de los archivos definitivos — renders y láminas finales, verificados abriendo cada archivo como lo va a recibir el público.","Entrega final cerrada de su casa."]],"12-3":["Presentación final","Proyecto + voz propia","Presentar una propuesta personal demostrando el recorrido completo desde observación hasta comunicación.",[["Montaje","Orden de presentación y archivos."],["Presentaciones","Cada alumno: relevamiento, problema, concepto, proceso, propuesta, documentación y render."],["Devolución","Evaluar coherencia entre intención, espacio, técnica e imagen."],["Cierre","Volver a la primera composición: reconocer qué decisiones y voz propia sobrevivieron hasta el proyecto final."]],"Wong + Ching + Manual de dibujo técnico + Neufert: integración final.","Presentación final individual",["Presentación final individual: sitio, problema, concepto, proceso, propuesta, documentación y render — el recorrido completo del curso, con su propia voz. Se vuelve a mirar la primera composición de la semana 1 para reconocer qué decisiones sobrevivieron hasta acá.","Cierre del curso."],"Entrega final"]};
const L={};Object.entries(lessons).forEach(([k,v])=>L[k]={title:v[0],sub:v[1],objective:v[2],blocks:v[3],book:v[4],checks:[v[5]],taller:v[6]||[],entrega:v[7]||null});
const done=id=>localStorage.getItem('dtp-done-'+id)==='1';function render(){calendar.innerHTML='';for(let w=1;w<=12;w++){let row=document.createElement('div');row.className='week';row.innerHTML=`<div class="weeklabel"><b>${String(w).padStart(2,'0')}</b><span>SEMANA ${w}</span></div>`;for(let c=1;c<=3;c++){let id=`${w}-${c}`,d=L[id],s=document.createElement('div');s.className='slot';s.innerHTML=`<button class="card ${done(id)?'done':''}"><span class="mark"></span><span class="kicker">CLASE ${String(c).padStart(2,'0')}${d.entrega?`<span class="entrega-badge">${d.entrega}</span>`:''}</span><span class="title">${d.title}</span><span class="sub">${d.sub}</span><span class="date">Fecha: <input type="date" value="${localStorage.getItem('dtp-date-'+id)||''}"></span></button>`;let b=s.querySelector('button'),i=s.querySelector('input');b.onclick=e=>{if(e.target!==i)openLesson(id)};i.onclick=e=>e.stopPropagation();i.onchange=e=>localStorage.setItem('dtp-date-'+id,e.target.value);row.appendChild(s)}calendar.appendChild(row)}progress()}
function openLesson(id){let d=L[id];modalKicker.textContent=`SEMANA ${id.split('-')[0]} · CLASE ${id.split('-')[1]}${d.entrega?' · '+d.entrega.toUpperCase():''}`;modalTitle.textContent=d.title;let programa=d.blocks.map(b=>`<div class="prog"><b>${b[0]}</b><div>${b[1]}</div>${b[2]?`<div class="commands">${b[2].split(',').map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>`).join('');let taller=d.taller&&d.taller.length?`<div class="taller"><h4>Taller · 30 min · consulta sobre su casa</h4><p>${d.taller[0]}</p>${d.taller[1]?`<p class="tarea"><b>Tarea de hoy</b> ${d.taller[1]}</p>`:''}</div>`:'';let notesVal=localStorage.getItem('dtp-notes-'+id)||'';modalBody.innerHTML=`<div class="complete"><b>Clase realizada</b><input id="complete" type="checkbox" ${done(id)?'checked':''}></div><div class="callout"><b>Objetivo</b><div>${d.objective}</div></div><div class="secttl">Programa · 60 min</div>${programa}${taller}<div class="book"><b>Bibliografía</b><div>${d.book}</div></div><div class="checks"><label><input type="checkbox"> ${d.checks[0]}</label></div><div class="notes"><b>Tus notas</b><span class="notes-sub">Espacio libre — lo que quieras sumar a esta clase queda guardado en este dispositivo.</span><textarea id="notesBox" placeholder="Agregá acá lo que quieras para esta clase...">${notesVal.replace(/</g,'&lt;')}</textarea></div>`;complete.onchange=e=>{localStorage.setItem('dtp-done-'+id,e.target.checked?'1':'0');render()};document.getElementById('notesBox').oninput=e=>{localStorage.setItem('dtp-notes-'+id,e.target.value)};backdrop.classList.add('open')}
function progress(){let n=0;for(let w=1;w<=12;w++)for(let c=1;c<=3;c++)if(done(`${w}-${c}`))n++;progressText.textContent=`${n} / 36`;progressFill.style.width=`${n/36*100}%`}close.onclick=()=>backdrop.classList.remove('open');backdrop.onclick=e=>{if(e.target===backdrop)backdrop.classList.remove('open')};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
