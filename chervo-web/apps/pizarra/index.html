<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pizarra">
<title>Pizarra de Clase</title>
<link rel="manifest" href="/apps/pizarra/manifest.webmanifest">
<link rel="icon" href="/apps/pizarra/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apps/pizarra/icon-192.png">
<style>
:root{--paper:#fff;--panel:#f7f7f5;--line:#dcdcd8;--line-soft:#ececea;--ink:#1c1c1c;--muted:#7a7a7a;--red:#fe0000}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{width:100%;height:100%;display:flex;flex-direction:column;background:var(--paper)}.board-wrap{position:relative;flex:1;min-height:0;order:1;background:var(--paper)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--paper);cursor:crosshair;touch-action:none}.toolbar-shell{order:2;flex:0 0 auto;background:rgba(255,255,255,.96);border-top:1px solid var(--line-soft);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.toolbar{height:42px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}.sep{width:1px;height:24px;background:var(--line-soft);flex:0 0 1px;margin:0 2px}.tool-btn{width:36px;height:36px;flex:0 0 36px;border:1px solid transparent;background:transparent;border-radius:9px;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .14s,border-color .14s,color .14s,transform .14s}.tool-btn:hover{background:var(--panel)}.tool-btn:active{transform:scale(.96)}.tool-btn.active{border-color:var(--red);color:var(--red);background:#fff}.tool-btn:disabled{opacity:.28;cursor:default}.tool-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}.tool-btn.primary{color:var(--red)}.colors{display:flex;align-items:center;gap:6px;padding:0 2px}.color-btn{width:24px;height:24px;min-width:24px;border-radius:50%;border:2px solid #fff;padding:0;cursor:pointer;box-shadow:0 0 0 1px #bcbfbe;transition:box-shadow .14s,transform .14s}.color-btn:active{transform:scale(.92)}.color-btn.active{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--red)}.size-wrap{display:flex;align-items:center;gap:7px;padding:0 5px;flex:0 0 auto}.size-dot{width:9px;height:9px;border-radius:50%;background:var(--ink);flex:0 0 auto}#size{width:88px;height:22px;accent-color:var(--red);cursor:pointer}.toast{position:absolute;right:12px;top:12px;z-index:3;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.94);box-shadow:0 8px 26px rgba(0,0,0,.06);font-size:14px;color:var(--muted);pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s}.toast.show{opacity:1;transform:none}@media(max-width:760px){.toolbar{justify-content:flex-start;height:40px}.tool-btn{width:34px;height:34px;flex-basis:34px;border-radius:8px}.tool-btn svg{width:22px;height:22px}#size{width:72px}.toolbar-shell{padding-top:5px}}@media(pointer:coarse){.tool-btn{width:40px;height:40px;flex-basis:40px}.toolbar{height:44px}}
</style>
</head>
<body>
<div class="app">
<div class="board-wrap" id="boardWrap"><canvas id="board" aria-label="Pizarra de dibujo"></canvas><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<div class="toolbar-shell"><div class="toolbar" aria-label="Herramientas de pizarra">
<button class="tool-btn primary" id="appsBtn" title="Aplicaciones" aria-label="Volver a aplicaciones"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.3"/></svg></button><span class="sep"></span>
<button class="tool-btn active" id="penBtn" title="Lápiz (P)" aria-label="Lápiz"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></button>
<button class="tool-btn" id="eraserBtn" title="Borrador (E)" aria-label="Borrador"><svg viewBox="0 0 24 24"><path d="m4 15 9-10 7 6-8 9H7z"/><path d="m9 20 7-8"/></svg></button><span class="sep"></span>
<div class="colors" aria-label="Colores"><button class="color-btn active" data-color="#1c1c1c" data-name="Negro" style="background:#1c1c1c" title="Negro" aria-label="Negro"></button><button class="color-btn" data-color="#d62828" data-name="Rojo" style="background:#d62828" title="Rojo" aria-label="Rojo"></button><button class="color-btn" data-color="#1d4ed8" data-name="Azul" style="background:#1d4ed8" title="Azul" aria-label="Azul"></button><button class="color-btn" data-color="#15803d" data-name="Verde" style="background:#15803d" title="Verde" aria-label="Verde"></button><button class="color-btn" data-color="#f59e0b" data-name="Amarillo" style="background:#f59e0b" title="Amarillo" aria-label="Amarillo"></button></div><span class="sep"></span>
<label class="size-wrap" title="Grosor"><span class="size-dot" id="sizeDot" aria-hidden="true"></span><input id="size" type="range" min="1" max="28" value="4" aria-label="Grosor del trazo"></label><span class="sep"></span>
<button class="tool-btn" id="undoBtn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg></button><button class="tool-btn" id="redoBtn" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg></button><button class="tool-btn" id="clearBtn" title="Limpiar pizarra" aria-label="Limpiar pizarra"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/></svg></button><span class="sep"></span>
<button class="tool-btn primary" id="saveBtn" title="Guardar PNG" aria-label="Guardar como PNG"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><rect x="8.5" y="13" width="7" height="5"/></svg></button><button class="tool-btn primary" id="fullBtn" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg></button>
</div></div></div>
<script>
(()=>{const canvas=document.getElementById('board'),ctx=canvas.getContext('2d',{willReadFrequently:true}),wrap=document.getElementById('boardWrap'),penBtn=document.getElementById('penBtn'),eraserBtn=document.getElementById('eraserBtn'),undoBtn=document.getElementById('undoBtn'),redoBtn=document.getElementById('redoBtn'),clearBtn=document.getElementById('clearBtn'),saveBtn=document.getElementById('saveBtn'),fullBtn=document.getElementById('fullBtn'),appsBtn=document.getElementById('appsBtn'),sizeInput=document.getElementById('size'),sizeDot=document.getElementById('sizeDot'),toast=document.getElementById('toast'),colorButtons=[...document.querySelectorAll('.color-btn')];let drawing=false,tool='pen',color='#1c1c1c',colorName='Negro',lineWidth=4,lastX=0,lastY=0,cssW=0,cssH=0,dpr=1;const undoStack=[],redoStack=[],maxHistory=40;let toastTimer;function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1100)}function snapshot(){return canvas.width&&canvas.height?canvas.toDataURL('image/png'):null}function pushUndo(){const state=snapshot();if(!state)return;undoStack.push(state);if(undoStack.length>maxHistory)undoStack.shift();redoStack.length=0;updateHistoryButtons()}function restore(dataURL){if(!dataURL)return;const img=new Image();img.onload=()=>{ctx.clearRect(0,0,cssW,cssH);ctx.drawImage(img,0,0,cssW,cssH)};img.src=dataURL}function updateHistoryButtons(){undoBtn.disabled=undoStack.length===0;redoBtn.disabled=redoStack.length===0}function resizeCanvas(){const rect=wrap.getBoundingClientRect(),previous=snapshot();cssW=Math.max(1,Math.floor(rect.width));cssH=Math.max(1,Math.floor(rect.height));dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.floor(cssW*dpr);canvas.height=Math.floor(cssH*dpr);canvas.style.width=cssW+'px';canvas.style.height=cssH+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(previous)restore(previous)}function pointFromEvent(e){const rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}function drawLine(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=tool==='eraser'?Math.max(14,lineWidth*4):lineWidth;if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='#000'}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color}ctx.stroke();ctx.globalCompositeOperation='source-over'}function startDraw(e){if(e.button!=null&&e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();pushUndo();drawing=true;canvas.setPointerCapture?.(e.pointerId);const p=pointFromEvent(e);lastX=p.x;lastY=p.y;drawLine(lastX,lastY,lastX+.01,lastY+.01)}function moveDraw(e){if(!drawing)return;e.preventDefault();const p=pointFromEvent(e);drawLine(lastX,lastY,p.x,p.y);lastX=p.x;lastY=p.y}function endDraw(e){if(!drawing)return;drawing=false;try{canvas.releasePointerCapture?.(e.pointerId)}catch{}updateHistoryButtons()}function selectTool(next,announce=true){tool=next;penBtn.classList.toggle('active',tool==='pen');eraserBtn.classList.toggle('active',tool==='eraser');canvas.style.cursor=tool==='eraser'?'cell':'crosshair';if(announce)showToast(tool==='pen'?`Lápiz · ${colorName} · ${lineWidth}px`:`Borrador · ${Math.max(14,lineWidth*4)}px`)}function setSize(value,announce=true){lineWidth=Number(value);sizeDot.style.width=Math.min(18,Math.max(5,lineWidth*.58+5))+'px';sizeDot.style.height=sizeDot.style.width;if(announce)showToast(`${tool==='pen'?colorName:'Borrador'} · ${lineWidth}px`)}canvas.addEventListener('pointerdown',startDraw);canvas.addEventListener('pointermove',moveDraw);canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);canvas.addEventListener('contextmenu',e=>e.preventDefault());penBtn.addEventListener('click',()=>selectTool('pen'));eraserBtn.addEventListener('click',()=>selectTool('eraser'));colorButtons.forEach(btn=>btn.addEventListener('click',()=>{color=btn.dataset.color;colorName=btn.dataset.name;colorButtons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectTool('pen',false);showToast(`Lápiz · ${colorName} · ${lineWidth}px`)}));sizeInput.addEventListener('input',()=>setSize(sizeInput.value));undoBtn.addEventListener('click',()=>{if(!undoStack.length)return;const current=snapshot();if(current)redoStack.push(current);restore(undoStack.pop());updateHistoryButtons();showToast('Deshecho')});redoBtn.addEventListener('click',()=>{if(!redoStack.length)return;const current=snapshot();if(current)undoStack.push(current);restore(redoStack.pop());updateHistoryButtons();showToast('Rehecho')});clearBtn.addEventListener('click',()=>{pushUndo();ctx.clearRect(0,0,cssW,cssH);updateHistoryButtons();showToast('Pizarra limpia')});saveBtn.addEventListener('click',()=>{const exportCanvas=document.createElement('canvas');exportCanvas.width=canvas.width;exportCanvas.height=canvas.height;const ex=exportCanvas.getContext('2d');ex.fillStyle='#fff';ex.fillRect(0,0,exportCanvas.width,exportCanvas.height);ex.drawImage(canvas,0,0);const link=document.createElement('a'),stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');link.download=`pizarra-${stamp}.png`;link.href=exportCanvas.toDataURL('image/png');link.click();showToast('PNG guardado')});fullBtn.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}});appsBtn.addEventListener('click',()=>{window.location.href='https://ilchervo.com/#apps'});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?redoBtn:undoBtn).click();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redoBtn.click();return}if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='p')selectTool('pen');else if(k==='e')selectTool('eraser');else if(k==='f')fullBtn.click()});window.addEventListener('resize',resizeCanvas);document.addEventListener('fullscreenchange',()=>setTimeout(resizeCanvas,50));resizeCanvas();setSize(lineWidth,false);updateHistoryButtons();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/apps/pizarra/sw.js',{scope:'/apps/pizarra/'}).catch(()=>{}))})();
</script>
</body>
</html>
