name: Pizarra grid one-time patch
on:
  push:
    paths:
      - '.github/workflows/pizarra-grid-once.yml'
permissions:
  contents: write
jobs:
  patch-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add Pizarra de Clase to apps grid
        shell: python
        run: |
          from pathlib import Path
          p = Path('chervo-web/index.html')
          s = p.read_text(encoding='utf-8')
          href = 'https://ilchervo.com/apps/pizarra/'
          if href not in s:
              marker = '<a class="app-card" href="https://ilchervo.com/apps/del-trazo-al-pixel/"'
              start = s.index(marker)
              end = s.index('</a>', start) + 4
              card = '\n<a class="app-card" href="https://ilchervo.com/apps/pizarra/" target="_blank" rel="noopener"><div class="app-ic"><img src="/apps/pizarra/icon.svg" alt="" style="width:100%;height:100%;display:block"></div><div class="app-info"><div class="app-name">Pizarra de Clase</div><div class="app-desc">Pizarra rápida para clases, croquis y explicaciones, con lápiz, borrador, colores y guardado PNG</div></div><div class="app-arrow">→</div></a>'
              s = s[:end] + card + s[end:]
              p.write_text(s, encoding='utf-8')
      - name: Commit grid change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ilchervonero-debug"
          git config user.email "ilchervonero@gmail.com"
          git add chervo-web/index.html
          git commit -m "Pizarra: sumar a la grilla de aplicaciones"
          git push origin master
